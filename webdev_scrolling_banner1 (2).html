<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Development Studio — Banner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --surface-1: #f4f3ee;
    --surface-2: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-accent: #185fa5;
    --bg-accent: #e6f1fb;
    --border: rgba(0,0,0,0.08);
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  .bd1 {
    margin: 0;
    padding: 2rem;
    background: #042b0d;
    font-family: var(--font-sans);
    color: var(--text-primary);
    width: 80%;
    margin-left: 10%;
    border-radius: 13px;
        border: 2px solid rgb(105, 6, 6); 
  }

  .banner {
    background: var(--surface-1);
    border-radius: 52px;
    padding: 3rem 0 2rem;
    overflow: hidden;
    max-width: 900px;
    margin: 0 auto;
  }

  .banner-content {
    padding: 0 3rem;
    margin-bottom: 1.5rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-accent);
    color: var(--text-accent);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: var(--radius);
    margin-bottom: 16px;
  }

  .badge i { font-size: 14px; }

  h1 {
    margin: 0 0 12px;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.25;
    max-width: 520px;
  }

  p {
    font-size: 16px;
    color: var(--text-secondary);
    margin: 0 0 20px;
    max-width: 480px;
    line-height: 1.7;
  }

  .cta {
    background: var(--text-primary);
    color: var(--surface-2);
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
  }

  .cta:hover { opacity: 0.9; }

  .marquee-wrap {
    position: relative;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, black 60px, black calc(100% - 60px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, black 60px, black calc(100% - 60px), transparent 100%);
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: scroll-left 22s linear infinite;
  }

  .marquee-track:hover { animation-play-state: paused; }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .marquee-group {
    display: flex;
    gap: 12px;
    padding-right: 12px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
  }

  .pill i { font-size: 18px; color: var(--text-accent); }
</style>
</head>
<body>
<div class="bd1"
<div class="banner">
  <div class="banner-content">
    <div class="badge">
      <i class="ti ti-code" aria-hidden="true"></i>
      Web and Wibe
    </div>
    <h1 style="color: #e6f1fb;">Websites and web apps built with the tools you trust</h1>
    <p style="color: #e6f1fb; ;">We design, build, and scale digital products end to end — from first sketch to production launch.</p>
    <button class="cta" onclick="window.location.href='#contact'">Get a quote ↗</button>
  </div>

  <div class="marquee-wrap">
    <div class="marquee-track">
      <div class="marquee-group" id="group1"></div>
      <div class="marquee-group" id="group2"></div>
    </div>
  </div>
</div>
</div>

<script>
  const items = [
    ["ti-brand-react", "React"],
    ["ti-brand-nodejs", "Python"],
    ["ti-brand-figma", "Figma"],
    ["ti-cloud", "Cloud hosting"],
    ["ti-shopping-cart", "E-commerce"],
    ["ti-search", "SEO"],
    ["ti-device-mobile", "Mobile first"],
    ["ti-api", "API integrations"],
    ["ti-lock", "Social Media Marketting"]
  ];

  const html = items.map(([icon, label]) =>
    `<div class="pill"><i class="ti ${icon}" aria-hidden="true"></i>${label}</div>`
  ).join('');

  document.getElementById('group1').innerHTML = html;
  document.getElementById('group2').innerHTML = html;
</script>

</body>
</html>
