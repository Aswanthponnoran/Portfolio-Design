<!--
  ============================================================
  ANIMATED HERO BANNER — Web Development Agency
  ============================================================
  HOW TO USE IN WORDPRESS:
  1. Edit the page where you want the banner (usually the homepage).
  2. Add a "Custom HTML" block (Gutenberg: Add Block → Custom HTML).
  3. Paste this entire snippet into that block.
  4. Edit the headline, rotating words, CTA text/link, and the
     floating tech-tag labels to match your agency (marked below).
  5. Publish.

  This is a normal in-page section (not a full-screen overlay) —
  it sits inline wherever you place the block, just like a
  regular hero/banner section.
  ============================================================
-->

<section id="agency-banner">
  <div class="ab-bg">
    <div class="ab-grid"></div>
    <div class="ab-orb ab-orb--1"></div>
    <div class="ab-orb ab-orb--2"></div>
  </div>

  <div class="ab-inner">
    <div class="ab-copy">
      <div class="ab-eyebrow"  style="color: #29cde2;">
        <span class="ab-dot"></span>Web Development Agency
      </div>

      <h1 style="color: #cac5c5;" class="ab-headline">
        We build <span style="color: #eb7d17;" class="ab-gradient">websites</span><br>
        that <span class="ab-rotator"><span id="abRotatorWord">convert</span></span>
      </h1>

      <p class="ab-sub" style="color: #eb7d17;">Custom design, clean code, and fast performance — from launch to scale.</p>

      <div class="ab-ctas">
        <a href="#contact" class="ab-btn ab-btn--primary">Start your project<span class="ab-btn-arrow">→</span></a>
        <a href="#work" class="ab-btn ab-btn--ghost">See our work</a>
      </div>
    </div>

    <div class="ab-visual">
      <div class="ab-window">
        <div class="ab-window-bar">
          <span class="ab-window-dot" style="background:#ff5f57;"></span>
          <span class="ab-window-dot" style="background:#febc2e;"></span>
          <span class="ab-window-dot" style="background:#28c840;"></span>
          <span class="ab-window-url">yoursite.com</span>
        </div>
        <div class="ab-window-body">
          <div class="ab-code-line"><span class="ab-code-tag">&lt;div</span> class=<span class="ab-code-str">"hero"</span><span class="ab-code-tag">&gt;</span></div>
          <div class="ab-code-line ab-indent"><span class="ab-code-tag">&lt;h1&gt;</span><span id="abTypedLine"></span><span class="ab-type-cursor">|</span></div>
          <div class="ab-code-line ab-indent"><span class="ab-code-tag">&lt;/h1&gt;</span></div>
          <div class="ab-code-line"><span class="ab-code-tag">&lt;/div&gt;</span></div>
          <div class="ab-window-bars">
            <div class="ab-window-barchart"><span></span><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>

      <div class="ab-tag ab-tag--1">WordPress</div>
      <div class="ab-tag ab-tag--2">React</div>
      <div class="ab-tag ab-tag--3">SEO Ready</div>
    </div>
  </div>
</section>

<style>
  #agency-banner{
    --ab-bg-0:#041f0e;
    --ab-bg-1:#041f0b;
    --ab-cyan:#8ec082;
    --ab-violet:#7bffa7;
    --ab-text:#22da8d;
    --ab-text-dim:#adb4b0;
    --ab-line:#03160d;
    --ab-panel:#06140c;

    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg, var(--ab-bg-0), var(--ab-bg-1));
    color:var(--ab-text);
    font-family:'Inter', ui-sans-serif, system-ui, sans-serif;
    padding:96px 5vw;
    box-sizing:border-box;
  }
  #agency-banner *{ box-sizing:border-box; }

  .ab-bg{ position:absolute; inset:0; z-index:0; }
  .ab-grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--ab-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--ab-line) 1px, transparent 1px);
    background-size:46px 46px;
    opacity:0.3;
    -webkit-mask-image:radial-gradient(ellipse 75% 75% at 30% 40%, rgb(179, 26, 26) 20%, transparent 75%);
            mask-image:radial-gradient(ellipse 75% 75% at 30% 40%, rgb(160, 14, 14) 20%, transparent 75%);
    animation:abDrift 18s linear infinite;
  }
  @keyframes abDrift{ from{ background-position:0 0,0 0; } to{ background-position:46px 46px,46px 46px; } }

  .ab-orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.35; }
  .ab-orb--1{ width:340px; height:340px; background:var(--ab-violet); top:-80px; right:8%; animation:abFloat 9s ease-in-out infinite; }
  .ab-orb--2{ width:260px; height:260px; background:var(--ab-cyan); bottom:-60px; left:6%; animation:abFloat 11s ease-in-out infinite reverse; }
  @keyframes abFloat{ 0%,100%{ transform:translateY(0px); } 50%{ transform:translateY(-26px); } }

  .ab-inner{
    position:relative; z-index:1;
    max-width:1160px; margin:0 auto;
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
  }
  @media (max-width:900px){ .ab-inner{ grid-template-columns:1fr; } }

  .ab-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ab-cyan);
    opacity:0; animation:abRise 0.7s ease forwards; animation-delay:0.05s;
  }
  .ab-dot{ width:6px; height:6px; border-radius:50%; background:var(--ab-cyan); box-shadow:0 0 8px var(--ab-cyan); animation:abPulseDot 1.8s ease-in-out infinite; }
  @keyframes abPulseDot{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .ab-headline{
    margin:18px 0 16px;
    font-size:clamp(34px, 4.6vw, 58px);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-0.01em;
    opacity:0; animation:abRise 0.8s ease forwards; animation-delay:0.15s;
  }
  .ab-gradient{
    background:linear-gradient(90deg, var(--ab-cyan), var(--ab-violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .ab-rotator{ position:relative; display:inline-block; color:var(--ab-violet); }
  #abRotatorWord{
    display:inline-block;
    transition:opacity 0.35s ease, transform 0.35s ease;
  }
  #abRotatorWord.ab-word-out{ opacity:0; transform:translateY(-10px); }

  .ab-sub{
    color:var(--ab-text-dim); font-size:16.5px; max-width:46ch; margin-bottom:34px;
    opacity:0; animation:abRise 0.8s ease forwards; animation-delay:0.28s;
  }

  @keyframes abRise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

  .ab-ctas{ display:flex; gap:14px; flex-wrap:wrap; opacity:0; animation:abRise 0.8s ease forwards; animation-delay:0.4s; }
  .ab-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 24px; border-radius:8px;
    font-size:14px; font-weight:600; text-decoration:none;
    transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  }
  .ab-btn--primary{
    background:linear-gradient(90deg, var(--ab-cyan), var(--ab-violet));
    color:#000000;
  }
  .ab-btn--primary:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(174, 209, 15, 0.35); }
  .ab-btn-arrow{ transition:transform 0.25s ease; }
  .ab-btn--primary:hover .ab-btn-arrow{ transform:translateX(3px); }
  .ab-btn--ghost{
    border:1px solid var(--ab-line); color:var(--ab-text);
  }
  .ab-btn--ghost:hover{ border-color:var(--ab-cyan); color:var(--ab-cyan); }

  /* --- visual: mock browser window --- */
  .ab-visual{ position:relative; opacity:0; animation:abRise 0.9s ease forwards; animation-delay:0.3s; }
  .ab-window{
    background:var(--ab-panel);
    border:1px solid var(--ab-line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(78, 95, 79, 0.45);
    animation:abWindowFloat 6s ease-in-out infinite;
  }
  @keyframes abWindowFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

  .ab-window-bar{
    display:flex; align-items:center; gap:8px;
    padding:12px 14px; border-bottom:1px solid var(--ab-line);
  }
  .ab-window-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .ab-window-url{
    margin-left:10px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ab-text-dim);
  }

  .ab-window-body{ padding:22px 20px 26px; font-family:'JetBrains Mono', monospace; font-size:13.5px; }
  .ab-code-line{ color:var(--ab-text-dim); margin-bottom:8px; white-space:nowrap; }
  .ab-indent{ padding-left:22px; }
  .ab-code-tag{ color:var(--ab-cyan); }
  .ab-code-str{ color:var(--ab-violet); }
  .ab-type-cursor{ color:var(--ab-cyan); animation:abBlink 0.9s steps(1) infinite; }
  @keyframes abBlink{ 50%{ opacity:0; } }

  .ab-window-bars{ margin-top:22px; }
  .ab-window-barchart{ display:flex; align-items:flex-end; gap:8px; height:60px; }
  .ab-window-barchart span{
    flex:1; border-radius:3px 3px 0 0;
    background:linear-gradient(180deg, var(--ab-cyan), var(--ab-violet));
    height:20%;
    animation:abBarGrow 2.6s ease-in-out infinite;
  }
  .ab-window-barchart span:nth-child(1){ animation-delay:0s; }
  .ab-window-barchart span:nth-child(2){ animation-delay:0.2s; }
  .ab-window-barchart span:nth-child(3){ animation-delay:0.4s; }
  .ab-window-barchart span:nth-child(4){ animation-delay:0.6s; }
  .ab-window-barchart span:nth-child(5){ animation-delay:0.8s; }
  @keyframes abBarGrow{
    0%,100%{ height:22%; }
    50%{ height:85%; }
  }

  .ab-tag{
    position:absolute;
    font-family:'JetBrains Mono', monospace; font-size:11.5px;
    padding:8px 14px; border-radius:20px;
    background:rgba(19,26,48,0.9);
    border:1px solid var(--ab-line);
    color:var(--ab-text);
    box-shadow:0 10px 20px rgba(180, 216, 20, 0.35);
    animation:abTagFloat 5s ease-in-out infinite;
  }
  .ab-tag--1{ top:-18px; left:-18px; animation-delay:0s; }
  .ab-tag--2{ bottom:22%; right:-26px; animation-delay:1s; }
  .ab-tag--3{ bottom:-16px; left:18%; animation-delay:2s; }
  @keyframes abTagFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }

  @media (max-width:900px){
    #agency-banner{ padding:72px 6vw; }
    .ab-tag{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    #agency-banner *{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>

<script>
(function(){
  var root = document.getElementById("agency-banner");
  if(!root) return;

  // Typewriter effect inside the mock browser window, loops through phrases
  var typedEl = root.querySelector("#abTypedLine");
  var phrases = ["Grow Your Business", "Built To Convert", "Fast & Responsive"]; // <-- EDIT these
  var pIndex = 0, cIndex = 0, deleting = false;

  function typeLoop(){
    var current = phrases[pIndex];
    if(!deleting){
      typedEl.textContent = current.slice(0, cIndex + 1);
      cIndex++;
      if(cIndex === current.length){
        deleting = true;
        setTimeout(typeLoop, 1400);
        return;
      }
    } else {
      typedEl.textContent = current.slice(0, cIndex - 1);
      cIndex--;
      if(cIndex === 0){
        deleting = false;
        pIndex = (pIndex + 1) % phrases.length;
      }
    }
    setTimeout(typeLoop, deleting ? 35 : 55);
  }
  typeLoop();

  // Rotating word in the headline ("convert" / "perform" / "scale")
  var rotatorEl = root.querySelector("#abRotatorWord");
  var words = ["convert", "perform", "scale", "last"]; // <-- EDIT these
  var wIndex = 0;
  setInterval(function(){
    rotatorEl.classList.add("ab-word-out");
    setTimeout(function(){
      wIndex = (wIndex + 1) % words.length;
      rotatorEl.textContent = words[wIndex];
      rotatorEl.classList.remove("ab-word-out");
    }, 350);
  }, 2600);
})();
</script>
